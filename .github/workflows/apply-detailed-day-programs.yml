name: Apply detailed day programmes

on:
  push:
    branches:
      - chatgpt/schritt-5-inhalte
    paths:
      - .github/workflows/apply-detailed-day-programs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-detailed-day-programs
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/schritt-5-inhalte
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Update day programmes
        run: python scripts/update-detailed-day-programs.py
      - name: Commit day programmes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/reisetage
          git commit -m "Expand all Georgia day programmes [skip ci]"
          git pull --rebase origin chatgpt/schritt-5-inhalte
          git push origin HEAD:chatgpt/schritt-5-inhalte
