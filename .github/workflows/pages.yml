name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-24-npm-${{ hashFiles('package-lock.json') }}
      - name: Initialise quality summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Pages quality

          **npm-Cache:** ${{ steps.npm-cache.outputs.cache-hit == 'true' && 'warm (exakter Lockfile-Treffer)' || 'kalt (kein exakter Lockfile-Treffer)' }}

          | Phase | Ergebnis | Laufzeit | Build-Grösse | HTML-Dateien |
          | --- | --- | ---: | ---: | ---: |
          EOF
      - name: Prepare licensed media
        run: node scripts/run-ci-step.mjs "Medienvorbereitung" npm run media
      - name: Install locked dependencies
        env:
          CI_NPM_CACHE_STATUS: ${{ steps.npm-cache.outputs.cache-hit == 'true' && 'warm' || 'kalt' }}
        run: node scripts/run-ci-step.mjs "Installation (npm ci)" npm ci
      - name: Check Astro and TypeScript
        run: node scripts/run-ci-step.mjs "Qualitätsprüfung (Astro/TypeScript)" npm run check
      - name: Run tests
        run: node scripts/run-ci-step.mjs "Qualitätsprüfung (Tests)" npm run test
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Restore npm download cache
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-24-npm-${{ hashFiles('package-lock.json') }}
      - name: Initialise build summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Pages build

          **npm-Cache:** ${{ steps.npm-cache.outputs.cache-hit == 'true' && 'warm (exakter Lockfile-Treffer)' || 'kalt (kein exakter Lockfile-Treffer)' }}

          | Phase | Ergebnis | Laufzeit | Build-Grösse | HTML-Dateien |
          | --- | --- | ---: | ---: | ---: |
          EOF
      - name: Prepare licensed media
        run: node scripts/run-ci-step.mjs "Medienvorbereitung" npm run media
      - name: Install locked dependencies
        env:
          CI_NPM_CACHE_STATUS: ${{ steps.npm-cache.outputs.cache-hit == 'true' && 'warm' || 'kalt' }}
        run: node scripts/run-ci-step.mjs "Installation (npm ci)" npm ci
      - name: Build site
        run: node scripts/run-ci-step.mjs "Build" npm run build:ci
      - name: Build Pagefind index
        run: node scripts/run-ci-step.mjs "Pagefind" npm run index:search
      - name: Validate generated internal links
        run: node scripts/run-ci-step.mjs "Build-Validierung" npm run validate:build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Start artifact upload timer
        id: upload-timer
        run: echo "started=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Upload GitHub Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with: {path: dist}
      - name: Record artifact upload duration
        if: always()
        env:
          STARTED: ${{ steps.upload-timer.outputs.started }}
          OUTCOME: ${{ steps.upload.outcome }}
        run: node scripts/record-ci-action.mjs "Upload" "$STARTED" "$OUTCOME" dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [quality, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Initialise deployment summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Pages deployment

          | Phase | Ergebnis | Laufzeit | Build-Grösse | HTML-Dateien |
          | --- | --- | ---: | ---: | ---: |
          EOF
      - name: Start deployment timer
        id: deployment-timer
        run: echo "started=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
      - name: Record deployment duration
        if: always()
        env:
          STARTED: ${{ steps.deployment-timer.outputs.started }}
          OUTCOME: ${{ steps.deployment.outcome }}
        run: node scripts/record-ci-action.mjs "Deployment" "$STARTED" "$OUTCOME"
