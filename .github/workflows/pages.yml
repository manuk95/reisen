name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Prepare licensed media
        run: node scripts/run-ci-step.mjs "Medienvorbereitung" npm run media
      - name: Install locked dependencies
        run: node scripts/run-ci-step.mjs "Installation" npm ci
      - name: Check Astro and TypeScript
        run: node scripts/run-ci-step.mjs "Astro-Check" npm run check
      - name: Run tests
        run: node scripts/run-ci-step.mjs "Tests" npm run test
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Initialise build summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Pages build

          | Phase | Ergebnis | Laufzeit | Build-Grösse | HTML-Dateien |
          | --- | --- | ---: | ---: | ---: |
          EOF
      - name: Prepare licensed media
        run: node scripts/run-ci-step.mjs "Medienvorbereitung" npm run media
      - name: Install locked dependencies
        run: node scripts/run-ci-step.mjs "Installation" npm ci
      - name: Build site and Pagefind index
        run: node scripts/run-ci-step.mjs "Build/Pagefind" npm run build
      - name: Validate generated internal links
        run: node scripts/run-ci-step.mjs "Build-Validierung" npm run validate:build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with: {path: dist}
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [quality, build]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
