name: Replace Sameba image

on:
  push:
    branches:
      - chatgpt/schritt-5-inhalte
    paths:
      - .github/workflows/replace-sameba-image.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/schritt-5-inhalte
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: python -m pip install --disable-pip-version-check requests pillow

      - name: Fetch licensed Sameba exterior image and update metadata
        run: |
          python - <<'PY'
          import html, json, re
          from io import BytesIO
          from pathlib import Path
          from urllib.parse import quote, unquote
          import requests
          from PIL import Image, ImageOps

          filename = 'Sameba Cathedral, Tbilisi کلیسای سامبا در تفلیس گرجستان 42.jpg'
          api = 'https://commons.wikimedia.org/w/api.php'
          headers = {'User-Agent': 'reisen-georgien-sameba-image/1.0'}
          params = {
              'action': 'query', 'format': 'json', 'formatversion': '2',
              'prop': 'imageinfo', 'iiprop': 'url|extmetadata',
              'titles': f'File:{filename}'
          }
          r = requests.get(api, params=params, headers=headers, timeout=60)
          r.raise_for_status()
          page = r.json()['query']['pages'][0]
          info = page['imageinfo'][0]
          meta = info.get('extmetadata', {})
          clean = lambda s: html.unescape(re.sub(r'<[^>]+>', '', s or '')).strip()
          author = clean(meta.get('Artist', {}).get('value', '')) or 'Wikimedia-Commons-Beitragende'
          license_name = clean(meta.get('LicenseShortName', {}).get('value', ''))
          if not any(x in license_name.lower() for x in ['cc by', 'cc0', 'public domain']):
              raise RuntimeError(f'Unklare Lizenz: {license_name}')

          source_url = unquote(info['url'].split('?', 1)[0])
          proxy = 'https://images.weserv.nl/?url=' + quote(source_url, safe='') + '&w=1600&output=jpg&q=86'
          img_resp = requests.get(proxy, headers=headers, timeout=90)
          img_resp.raise_for_status()
          image = ImageOps.exif_transpose(Image.open(BytesIO(img_resp.content))).convert('RGB')
          image.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
          target = Path('public/images/georgien/sehenswuerdigkeiten/sameba-kathedrale.jpg')
          image.save(target, 'JPEG', quality=86, optimize=True, progressive=True)

          md = Path('src/content/sehenswuerdigkeiten/sameba-kathedrale.md')
          text = md.read_text(encoding='utf-8')
          commons_page = 'https://commons.wikimedia.org/wiki/File:' + quote(filename.replace(' ', '_'), safe='_-().,%')
          replacements = {
              'imageAlt': 'Nahansicht der hellen Steinfassade und der goldenen Kuppel der Sameba-Kathedrale in Tbilisi',
              'imageCredit': author,
              'imageSource': commons_page,
              'imageLicense': license_name,
              'imageEdit': 'Auf höchstens 1600 Pixel Kantenlänge verkleinert; keine inhaltliche Bearbeitung.'
          }
          for key, value in replacements.items():
              text = re.sub(rf'^{key}:.*$', f'{key}: {json.dumps(value, ensure_ascii=False)}', text, flags=re.M)
          md.write_text(text, encoding='utf-8')
          print(f'Sameba ersetzt: {image.width}x{image.height} | {license_name} | {author}')
          PY

      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/georgien/sehenswuerdigkeiten/sameba-kathedrale.jpg src/content/sehenswuerdigkeiten/sameba-kathedrale.md
          git commit -m "Replace Sameba cathedral image [skip ci]"
          git pull --rebase origin chatgpt/schritt-5-inhalte
          git push origin HEAD:chatgpt/schritt-5-inhalte
