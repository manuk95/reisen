name: Replace Sameba image

on:
  push:
    branches:
      - chatgpt/schritt-5-inhalte
    paths:
      - .github/workflows/replace-sameba-image.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/schritt-5-inhalte
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check requests pillow
      - name: Replace Sameba image from Wikimedia Commons
        run: |
          python - <<'PY'
          import html, json, re
          from io import BytesIO
          from pathlib import Path
          from urllib.parse import quote, unquote
          import requests
          from PIL import Image, ImageOps

          filename = 'Sameba Cathedral, Tiflis, Georgia, 2019.jpg'
          api = 'https://commons.wikimedia.org/w/api.php'
          headers = {'User-Agent': 'reisen-georgien-sameba/1.0 (GitHub Actions)'}
          params = {
              'action':'query','format':'json','formatversion':'2',
              'prop':'imageinfo','iiprop':'url|extmetadata',
              'titles':f'File:{filename}'
          }
          r = requests.get(api, params=params, headers=headers, timeout=45)
          r.raise_for_status()
          page = r.json()['query']['pages'][0]
          if page.get('missing'):
              raise RuntimeError('Commons file not found')
          info = page['imageinfo'][0]
          meta = info.get('extmetadata', {})
          clean = lambda s: html.unescape(re.sub(r'<[^>]+>', '', s or '')).strip()
          license_name = clean(meta.get('LicenseShortName', {}).get('value', ''))
          author = clean(meta.get('Artist', {}).get('value', '')) or 'Wikimedia-Commons-Beitragende'
          if not any(x in license_name.lower() for x in ['cc by', 'cc0', 'public domain']):
              raise RuntimeError(f'Unklare Lizenz: {license_name}')

          source_url = unquote(info['url'].split('?', 1)[0])
          proxy = 'https://images.weserv.nl/?url=' + quote(source_url, safe='') + '&w=1600&output=jpg&q=88'
          img_r = requests.get(proxy, headers=headers, timeout=90)
          img_r.raise_for_status()
          image = Image.open(BytesIO(img_r.content))
          image = ImageOps.exif_transpose(image).convert('RGB')
          image.thumbnail((1600,1600), Image.Resampling.LANCZOS)
          target = Path('public/images/georgien/sehenswuerdigkeiten/sameba-kathedrale.jpg')
          image.save(target, 'JPEG', quality=88, optimize=True, progressive=True)

          md = Path('src/content/sehenswuerdigkeiten/sameba-kathedrale.md')
          text = md.read_text(encoding='utf-8')
          commons = 'https://commons.wikimedia.org/wiki/File:' + quote(filename.replace(' ', '_'), safe='_-().,')
          text = re.sub(r'^imageAlt:.*$', 'imageAlt: "Sameba-Kathedrale in Tbilisi mit ihrer monumentalen Natursteinfassade"', text, count=1, flags=re.M)
          text = re.sub(r'^imageCredit:.*$', 'imageCredit: ' + json.dumps(author, ensure_ascii=False), text, count=1, flags=re.M)
          text = re.sub(r'^imageSource:.*$', 'imageSource: ' + json.dumps(commons, ensure_ascii=False), text, count=1, flags=re.M)
          text = re.sub(r'^imageLicense:.*$', 'imageLicense: ' + json.dumps(license_name, ensure_ascii=False), text, count=1, flags=re.M)
          text = re.sub(r'^imageEdit:.*$', 'imageEdit: "Auf höchstens 1600 Pixel Kantenlänge verkleinert; keine inhaltliche Bearbeitung."', text, count=1, flags=re.M)
          text = re.sub(r'^updated:.*$', 'updated: 2026-08-08', text, count=1, flags=re.M)
          md.write_text(text, encoding='utf-8')
          print(f'Replaced Sameba: {image.width}x{image.height}; {author}; {license_name}')
          PY
      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/georgien/sehenswuerdigkeiten/sameba-kathedrale.jpg src/content/sehenswuerdigkeiten/sameba-kathedrale.md
          git commit -m "Replace Sameba Cathedral image [skip ci]"
          git pull --rebase origin chatgpt/schritt-5-inhalte
          git push origin HEAD:chatgpt/schritt-5-inhalte
