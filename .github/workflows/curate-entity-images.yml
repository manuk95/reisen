name: Curate hotel and restaurant images

on:
  push:
    branches:
      - chatgpt/hotel-restaurant-bilder-2026-08-12
    paths:
      - .github/workflows/curate-entity-images.yml

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - name: Bildquellen für Runner anpassen
        run: python3 scripts/patch-image-sources.py
      - name: Bilder laden und Inhalte aktualisieren
        run: node scripts/curate-entity-images.mjs
      - run: npm run check
      - run: npm run test
      - run: npm run build
      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/curate-entity-images.yml scripts/curate-entity-images.mjs scripts/patch-image-sources.py
          git add public/images/georgien/hotels public/images/georgien/restaurants src/content/unterkuenfte src/content/restaurants src/components/CollectionList.astro 'src/pages/georgien/hotels/[slug].astro' 'src/pages/georgien/restaurants/[slug].astro'
          git commit -m "Ergänze Bilder für Hotels und Restaurants"
          git push
