name: Fetch selected business images

on:
  push:
    branches:
      - chatgpt/schritt-5-inhalte
    paths:
      - scripts/fetch-selected-business-images.mjs
      - scripts/run-business-image-import-with-retry.mjs
      - .github/workflows/fetch-selected-business-images.yml

permissions:
  contents: write

jobs:
  fetch-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/schritt-5-inhalte

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download curated images and update metadata
        run: node scripts/run-business-image-import-with-retry.mjs

      - name: Commit images and content metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/georgien/restaurants public/images/georgien/unterkuenfte src/content/restaurants src/content/unterkuenfte
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add curated hotel and restaurant images"
          git push origin HEAD:chatgpt/schritt-5-inhalte
