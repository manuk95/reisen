name: Final sight image import

on:
  push:
    branches:
      - chatgpt/schritt-5-inhalte
    paths:
      - .github/workflows/fetch-sights-final.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-sight-image-import
  cancel-in-progress: true

jobs:
  import-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/schritt-5-inhalte
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: python -m pip install --disable-pip-version-check requests pillow

      - name: Import verified Commons images
        run: python scripts/fetch-missing-sight-images.py

      - name: Commit imported images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/georgien/sehenswuerdigkeiten src/content/sehenswuerdigkeiten
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add remaining sight images [skip ci]"
          git pull --rebase origin chatgpt/schritt-5-inhalte
          git push origin HEAD:chatgpt/schritt-5-inhalte
