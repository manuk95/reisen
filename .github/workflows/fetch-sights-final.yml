name: Final sight image import

on:
  push:
    branches:
      - chatgpt/schritt-5-inhalte
    paths:
      - .github/workflows/fetch-sights-final.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/schritt-5-inhalte
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - run: python -m pip install --disable-pip-version-check requests pillow

      - name: Force proxy transfer and import images
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/fetch-missing-sight-images.py')
          text = p.read_text(encoding='utf-8')
          old = '''    try:\n        r = get_with_retry(meta["url"], timeout=90, attempts=2)\n    except requests.HTTPError as exc:\n        if exc.response is None or exc.response.status_code != 429:\n            raise\n        proxy = "https://images.weserv.nl/?url=" + quote(meta["url"], safe="") + "&w=1600&output=jpg&q=86"\n        print(f"{slug}: Wikimedia limitiert den Download; nutze einmaligen Bildproxy für denselben Commons-Inhalt")\n        r = get_with_retry(proxy, timeout=90, attempts=6)\n'''
          new = '''    proxy = "https://images.weserv.nl/?url=" + quote(meta["url"], safe="") + "&w=1600&output=jpg&q=86"\n    print(f"{slug}: Bildtransfer über Proxy; Quelle und Lizenz bleiben Wikimedia Commons")\n    r = get_with_retry(proxy, timeout=60, attempts=3)\n'''
          if old not in text:
              raise SystemExit('Expected download block not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python scripts/fetch-missing-sight-images.py

      - name: Commit imported images
        run: |
          git restore scripts/fetch-missing-sight-images.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/georgien/sehenswuerdigkeiten src/content/sehenswuerdigkeiten
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add missing sight images [skip ci]"
          git pull --rebase origin chatgpt/schritt-5-inhalte
          git push origin HEAD:chatgpt/schritt-5-inhalte
