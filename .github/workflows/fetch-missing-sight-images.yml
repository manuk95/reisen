name: Fetch missing sight images

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-missing-sight-images
  cancel-in-progress: true

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: chatgpt/schritt-5-inhalte
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Fetch and prepare images
        run: python scripts/fetch-missing-sight-images.py

      - name: Commit images and metadata
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No image changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/georgien/sehenswuerdigkeiten src/content/sehenswuerdigkeiten
          git commit -m "Add missing sight images [skip ci]"
          git pull --rebase origin chatgpt/schritt-5-inhalte
          git push origin HEAD:chatgpt/schritt-5-inhalte
